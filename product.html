<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalle del producto — Thrift Cálido Bazar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    body { background:#f8fafc; }
    .btn-burly { background-color: burlywood; color:#fff; }
    .btn-burly:hover { filter:brightness(0.9); color:#fff; }
    .detail-card { border:none; border-radius:18px; box-shadow:0 18px 36px rgba(15,23,42,.08); }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand d-flex align-items-center" href="index.html">
      <i class="bi bi-shop me-2" style="color: burlywood; font-size:1.4rem"></i>
      <span style="color: burlywood; font-weight: bold;">Thrift Cálido Bazar</span>
    </a>
    <div class="ms-auto d-flex gap-2 flex-wrap align-items-center">
      <a href="index.html" class="btn btn-sm btn-burly">Inicio</a>
      <a href="catalog.html" class="btn btn-sm btn-burly">Catálogo</a>
      <a href="cart.html" class="btn btn-sm btn-burly">
        <i class="bi bi-cart3"></i> Carrito
        <span class="badge bg-light text-dark ms-1 d-none" data-cart-count>0</span>
      </a>
      <a href="views/usuarios.html" class="btn btn-sm btn-outline-light">Mi perfil</a>
      <span id="navUserName" class="text-white-50 small ms-2"></span>
      <button class="btn btn-sm btn-outline-light" onclick="clearSession(); window.location.href='login.html';">
        <i class="bi bi-box-arrow-right"></i> Cerrar sesión
      </button>
    </div>
  </nav>

  <div class="container my-5">
    <div id="productMsg"></div>
    <div class="card detail-card p-4">
      <div id="productDetailPage"></div>
    </div>

    <section class="mt-4">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
          <h2 class="h4 fw-bold mb-1" style="color: burlywood;">Más opciones</h2>
          <p class="text-muted mb-0">Productos relacionados de la misma categoría.</p>
        </div>
      </div>
      <div class="row g-3 mt-1" id="relatedProducts"></div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="src/js/api.js"></script>
  <script src="src/js/ecommerce.js"></script>
  <script src="src/js/navbar-role.js"></script>
  <script src="src/js/product-detail.js"></script>
</body>
</html>
